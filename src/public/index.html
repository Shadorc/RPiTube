<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>RPiTube</title>
    <style>
        :root {
            --bg: #f3f5f4;
            --surface: #ffffff;
            --ink: #14201c;
            --muted: #5d6b66;
            --line: #d5dcd9;
            --accent: #0b7a64;
            --danger: #b3261e;
            --log-bg: #e9eeec;
            --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1514;
                --surface: #19211f;
                --ink: #e6efec;
                --muted: #93a39d;
                --line: #2b3633;
                --accent: #3fc9a9;
                --danger: #ff8a80;
                --log-bg: #131a18;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 600px;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }


        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px 8px;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        #status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--line);
            font-size: 0.9rem;
            font-weight: 600;
        }

        #status::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
        }

        #status[data-state="busy"]::before {
            background: #e0a100;
        }

        #status[data-state="playing"]::before {
            background: var(--accent);
        }

        #status[data-state="error"]::before {
            background: var(--danger);
        }

        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 8px 16px 16px;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        #logs {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0;
            padding: 12px;
            background: var(--log-bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            font: 0.82rem/1.5 var(--mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #logs .line.error {
            color: var(--danger);
        }

        #logs .line.empty {
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <h1>RPiTube</h1>
        <span id="status" data-state="idle" role="status">Waiting</span>
    </header>

    <main>
        <pre id="logs" aria-live="polite"><span class="line empty">Waiting for activity…</span></pre>
    </main>

    <script>
        const logsEl = document.getElementById('logs');
        const statusEl = document.getElementById('status');

        const MAX_LINES = 400;

        function setStatus(text, state) {
            statusEl.textContent = text;
            statusEl.dataset.state = state;
        }

        // Update the status badge from the server log messages
        function updateFromLog(line) {
            if (line.startsWith('[ERROR]') && !line.startsWith('[ERROR] [')) {
                setStatus('Error', 'error');
            } else if (line.startsWith('Downloading ')) {
                setStatus('Downloading', 'busy');
            } else if (line.startsWith('Casting ')) {
                setStatus('Playing', 'playing');
            } else if (line.startsWith('Finished casting')) {
                setStatus('Finished', 'idle');
            }
        }

        function addLine(text) {
            if (logsEl.querySelector('.empty')) {
                logsEl.textContent = '';
            }

            const nearBottom = logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 60;
            const span = document.createElement('span');
            span.className = 'line' + (text.startsWith('[ERROR]') ? ' error' : '');
            span.textContent = text + '\n';
            logsEl.appendChild(span);

            while (logsEl.childElementCount > MAX_LINES) {
                logsEl.firstChild.remove();
            }

            if (nearBottom) {
                logsEl.scrollTop = logsEl.scrollHeight;
            }

            updateFromLog(text);
        }

        // Stream logs from the server; reconnect if the connection drops
        async function streamLogs() {
            try {
                const response = await fetch('/logs');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // keep any incomplete line for the next chunk
                    lines.filter((l) => l.trim()).forEach(addLine);
                }
            } catch (err) {
                console.error(err);
            }

            setStatus('Disconnected', 'error');
            setTimeout(streamLogs, 3000);
        }

        streamLogs();
    </script>
</body>

</html>
